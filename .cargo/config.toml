# Assets live at the root of the workspace, next to the crates rather than
# inside one of them: what the game draws and plays is the game's, but nothing
# about a model or a sound file belongs to `crates/game` in the way its source
# does.
#
# Bevy looks for `assets/` under `BEVY_ASSET_ROOT`, falling back to
# `CARGO_MANIFEST_DIR` — which under `cargo run -p game` is `crates/game`, not
# here. Setting it explicitly is what makes the root `assets/` the one the game
# reads, whichever directory cargo is invoked from. `relative` is to this file's
# parent, so the path holds wherever the repository is checked out.
[env]
BEVY_ASSET_ROOT = { value = ".", relative = true }

# Every checkout of this repository — the main one and each worktree — compiles
# into one build directory, so Bevy is stored once rather than at ~2.7G a
# worktree. Only intermediates live there: final binaries still land in each
# checkout's own `target/`, so one worktree's `mapgen` never draws another's
# world. Builds in two checkouts take turns on its lock instead of running side
# by side, and `cargo clean` anywhere clears it for all of them.
[build]
build-dir = "{cargo-cache-home}/build/genovesa"
