# The headless side of a shared world, and the only process in a session that
# generates anything: a roster of who is where, and a workshop that hands out
# the ground a chunk at a time.
[package]
name = "server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
# Reached only by path, as the world crate is.
publish = false

[dependencies]
glam.workspace = true
# The world itself. A server is where it is generated, cached and sampled —
# clients are shown the results and never see this crate.
world = { path = "../world" }
# The words of the session, shared with every client so the two sides of the
# wire cannot drift.
protocol = { path = "../protocol" }
