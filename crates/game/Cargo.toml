[package]
name = "game"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
# The workspace holds a second binary — `mapgen`, over in the world crate — so a
# bare `cargo run` has to be told which of the two it means.
default-run = "game"

[dependencies]
# The world itself — terrain and the plan renderer — engine-free in its own
# crate; its `bevy` feature is only the derives that let the game hold its types
# as ECS resources.
world = { path = "../world", features = ["bevy"] }
# The words of a served session — shared with the server crate, so the two
# sides of the wire cannot drift.
protocol = { path = "../protocol" }
# A world the game hosts for itself. The server is engine-free and headless, so
# a game that starts one runs the very same session a dedicated `server` does —
# there is no second, lesser implementation for playing alone.
server = { path = "../server" }
bevy.workspace = true

[features]
# Much faster incremental builds while iterating: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]
