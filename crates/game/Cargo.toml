[package]
name = "game"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
# The workspace holds other binaries — `mapgen` in the world crate, `server` in
# its own — so a bare `cargo run` has to be told which it means.
default-run = "game"

[dependencies]
# The words of a served session, and with them everything the game knows about
# the ground: a chunk arrives as heights and palette entries, and this is what
# says how to read them. There is deliberately no dependency on `world` — the
# game generates nothing, and could be rewritten in another language against
# this crate's documentation alone.
protocol = { path = "../protocol" }
# A world the game hosts for itself. The server is engine-free and headless, so
# a game that opens a world runs the very same session a dedicated `server`
# does — there is no second, lesser implementation for playing alone. It is
# also the only way `world` reaches this build, which is the point: the world
# is behind the server, not beside the client.
server = { path = "../server" }
# The two-part options the command line takes, shared with `mapgen`.
# `system_font_discovery` puts the machine's own fonts in reach of a
# `FontSource::Family` or a generic one like `FontSource::Serif`, which is what
# the menu's title is set in. Without it Bevy has only the face compiled into
# it, and asking for a serif silently gets the same mono as everything else.
#
# `pbr_light_textures` is what lets a light be masked by a texture, and it is
# the whole of how the clouds reach the ground — see `clouds`. Off by default
# in Bevy because it costs every lit surface a texture lookup; here that buys
# the one piece of weather a camera pointed downwards can see.
#
# It is built on clustered decals, which want texture binding arrays, so an
# adapter without them draws the world with no clouds on it at all — the
# shader is compiled without the lookup and every surface reads full sun. That
# is a graceful way to lose them and a silent one: nothing logs, and a machine
# with no weather looks exactly like a machine having a clear day.
bevy = { workspace = true, features = [
    "system_font_discovery",
    "pbr_light_textures",
] }

[dev-dependencies]
# Reads assets/models/boat.glb in the tests that hold the model to what the collision
# code assumes of it. Only the tests parse glTF — the game hands the file to
# Bevy's own loader — and this is already in the tree behind Bevy, so it costs
# a line here and nothing to build.
serde_json = "1"

[features]
# Much faster incremental builds while iterating: `cargo run --features dev`.
# `file_watcher` is the other half of that: Bevy reloads an asset when the file
# changes, so a boat re-exported from Blender arrives in a game that is already
# running, and a shape can be looked at in the world it is meant for while it is
# still being moved. Not in a release build — it is a thread watching the
# assets directory, and a shipped game's assets do not change under it.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]
