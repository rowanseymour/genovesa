# The world without the engine: terrain generation and the plan renderer, with
# no Bevy dependency. It is a server's crate now — the one process in a session
# that generates anything — and the plan renderer's, so it never needs a
# renderer, a window or an ECS.
[package]
name = "world"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
# Reached only by path, and it names no version of itself that a dependant
# could ask for, so publishing it would only ever be a mistake.
publish = false

[dependencies]
# The two-part options `mapgen` takes, shared with the game so the two
# binaries reject a malformed one the same way.
# The same maths types Bevy re-exports, taken directly so this crate and the
# game agree on them without this crate depending on Bevy. Versioned by the
# workspace, which is what keeps that agreement true.
glam.workspace = true
# The wire's own vocabulary: the grid a chunk is drawn on and the palette it is
# painted from. Generation happens here and is *sent*, so the shape of what
# gets sent belongs with the words for it rather than here.
protocol = { path = "../protocol" }
# PNG encoding for the plan renders.
image = { version = "0.25", default-features = false, features = ["png"] }
# A pow this crate can trust. `f32::powf` is whatever libm the platform brought
# — Apple's, glibc's, Microsoft's — and the three do not agree to the last bit,
# which is enough to make a seed mean a different world on a different machine.
# This one is a port of MUSL's libm in plain Rust, so it is the same arithmetic
# everywhere it is compiled. See `pow` in terrain.rs.
libm = "0.2"
