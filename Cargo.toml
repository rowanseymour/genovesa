[package]
name = "kassiter"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
# Two binaries live here — the game and the map renderer — so a bare
# `cargo run` has to be told which one it means.
default-run = "game"

[dependencies]
bevy = "0.19"
# PNG encoding for the `mapgen` binary's plan renders. Bevy already pulls this
# in, so only the encoder itself is new.
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Much faster incremental builds while iterating: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

# Optimise dependencies even in debug builds, otherwise terrain generation and
# rendering crawl.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
