# A virtual workspace: nothing is built from here, and the crates sit as
# equals under crates/ — the game, the engine-free world a server generates,
# the protocol a served session speaks, and the server that hosts one.
[workspace]
members = [
    "crates/game",
    "crates/protocol",
    "crates/server",
    "crates/world",
]
resolver = "2"

# Bevy, the one piece of it the world crate uses directly, and the maths library
# the two of them meet on. None of the three can be bumped on its own: bevy_ecs
# is part of Bevy and glam is what bevy_math wraps, so a version that missed one
# of them would put two copies of it in the tree and the types the crates hand
# each other would quietly stop being the same types. Pinned together here so
# that moving Bevy is one edit rather than three that have to agree.
[workspace.dependencies]
bevy = "0.19"
bevy_ecs = "0.19"
glam = "0.32"

# Optimise dependencies even in debug builds, otherwise terrain generation and
# rendering crawl. They carry no debug info: 567 crates get compiled here and
# 67 of them are Bevy, so full DWARF for the lot is most of what `target/` ever
# weighs — 7.9G a build, and a build per worktree. Nothing here is debugged by
# stepping into Bevy, and the symbol names survive, so a backtrace still names
# the engine frames it passes through; it just cannot give them a line number.
[profile.dev.package."*"]
opt-level = 3
debug = false

# `line-tables-only` is the whole of what a backtrace needs — file and line for
# every frame — without the type and variable descriptions a debugger would
# want and nothing here asks for. Panics still point at the source.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
