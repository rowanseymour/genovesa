# The tests only mean something if more than one machine runs them. Several of
# them — the map digest, the archipelago layout and ground digests, the pinned
# bytes of every protocol message — exist to catch a build that has quietly
# stopped agreeing with every other build about what a seed means or what a
# message looks like, and a test like that run on one laptop is a test that has
# never once done its job. So the workspace is tested on Linux, and the crates
# that hold those pins are tested again on macOS and Windows: three operating
# systems and two processor architectures, all asked whether seed 20040112
# still makes the same island and whether the wire is still the same format.
name: CI

on:
  # Pull requests are where the checking actually happens; main is run again
  # after a merge so that a bad interaction between two green branches can't
  # sit there unnoticed. Widen this to a bare `push:` if you want every push to
  # every branch built, at the cost of running each PR commit twice.
  push:
    branches: [main]
  pull_request:

# One run per branch. A second push while the first is still compiling Bevy
# makes the first irrelevant, so don't pay for it — but let main's runs finish,
# since those are the record of what the branch actually did.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting compiles nothing, so it answers in seconds and doesn't need the
  # system libraries or the cache. On its own so that a stray blank line can't
  # hide a real test failure behind it.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy and the tests share a job, and therefore a target directory: `cargo
  # clippy` only puts workspace crates through clippy-driver and builds the
  # dependencies with plain rustc, so the several minutes of Bevy underneath
  # are compiled once here rather than once per job.
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What Bevy 0.19 asks for on a Linux builder — alsa and udev are what its
      # -sys crates go looking for through pkg-config, and wayland matches the
      # defaults of Bevy's own CI action. No window is ever opened here; these
      # are needed to link, not to run.
      - name: Install Bevy's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--locked` because Cargo.lock is committed and a crate that resolved to
      # a different version here than on a developer's machine is exactly the
      # kind of difference the digest tests are meant to notice.
      #
      # The four #[ignore]d tests in the world crate measure rather than assert
      # — cost and shape numbers to read, not thresholds to fail on — so they
      # stay ignored. Nothing here passes `--ignored`.
      - name: Tests
        run: cargo test --workspace --locked

  # The pinned things again, somewhere that isn't x86-64 Linux: the world's
  # digests and the protocol's exact bytes, with the server that sits on both.
  # These are the crates that hold no Bevy and need nothing from the system, so
  # the whole matrix costs a fraction of what one game build does — and they
  # are, not by coincidence, where every value that must match across machines
  # is written down. Anything new that pins bytes or digests belongs here too.
  # Linux isn't in this matrix because the job above already ran these tests
  # there as part of the workspace.
  determinism:
    name: Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let both finish. Which platforms disagree is the interesting part, and
      # a cancelled sibling job doesn't say.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine-free tests
        run: cargo test --locked -p world -p protocol -p server
