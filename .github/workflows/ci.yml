# The tests only mean something if more than one machine runs them. Several of
# them — the map digest, the archipelago layout and ground digests, the pinned
# bytes of every protocol message — exist to catch a build that has quietly
# stopped agreeing with every other build about what a seed means or what a
# message looks like, and a test like that run on one laptop is a test that has
# never once done its job. So the workspace is tested on Linux, and the crates
# that hold those pins are tested again on macOS and Windows: three operating
# systems and two processor architectures, all asked whether seed 20040112
# still makes the same island and whether the wire is still the same format.
name: CI

on:
  # Pull requests are where the checking actually happens; main is run again
  # after a merge so that a bad interaction between two green branches can't
  # sit there unnoticed. Widen this to a bare `push:` if you want every push to
  # every branch built, at the cost of running each PR commit twice.
  push:
    branches: [main]
  pull_request:

# One run per branch. A second push while the first is still compiling Bevy
# makes the first irrelevant, so don't pay for it — but let main's runs finish,
# since those are the record of what the branch actually did.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting compiles nothing, so it answers in seconds and doesn't need the
  # system libraries or the cache. On its own so that a stray blank line can't
  # hide a real test failure behind it.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy and the tests share a job, and therefore a target directory — but
  # not, as this comment used to claim, the work of building Bevy. Clippy is a
  # *check* build: it stops at metadata, so the dependencies come out as
  # `.rmeta` and there is not an `.rlib` among them for a test build to link
  # against. `cargo test` therefore compiles the whole of Bevy again, properly,
  # and on a cold cache this job pays for it twice — a few minutes to check and
  # the better part of an hour to compile. That is not a hang, however much it
  # looks like one; the step is compiling `bevy_ui_render` and will get there.
  #
  # Sharing the job is still right, for the reasons that survive: one restore
  # and one save of a target directory this size rather than two, and a clippy
  # failure that skips the test build rather than racing it. Splitting them
  # would run the two builds in parallel and cost a second cache of the same
  # several gigabytes to do it.
  #
  # Only the first run after a dependency change pays any of this. Every run
  # that restores a warm cache is a few minutes end to end.
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # What Bevy 0.19 asks for on a Linux builder — alsa and udev are what its
      # -sys crates go looking for through pkg-config, and wayland matches the
      # defaults of Bevy's own CI action. No window is ever opened here; these
      # are needed to link, not to run.
      #
      # fontconfig is the one that isn't Bevy's by default: turning on
      # `system_font_discovery` so the menu's title can ask for a serif puts
      # fontique in the tree, and on Linux fontique reads the machine's font
      # database through fontconfig. Its -sys crate resolves that at *build*
      # time and panics outright when pkg-config can't find it, so a builder
      # without this compiles nothing at all — not a link error at the end, a
      # dead stop before the workspace is even checked. A feature that only
      # shows on one screen is easy to add without thinking about the builder;
      # this list is where that gets paid for.
      - name: Install Bevy's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # `cache-on-failure` because the default is a trap for exactly this
      # workspace. The cache is normally written only by a job that passed, so
      # a job that fails its tests saves nothing and the next run compiles the
      # engine from cold again — three quarters of an hour, every time, for as
      # long as the branch is red. That is backwards: a red branch is when the
      # loop most needs to be short. The engine underneath is the same whether
      # the tests passed or not, so cache it either way.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--locked` because Cargo.lock is committed and a crate that resolved to
      # a different version here than on a developer's machine is exactly the
      # kind of difference the digest tests are meant to notice.
      #
      # The four #[ignore]d tests in the world crate measure rather than assert
      # — cost and shape numbers to read, not thresholds to fail on — so they
      # stay ignored. Nothing here passes `--ignored`.
      - name: Tests
        run: cargo test --workspace --locked

  # The pinned things again, somewhere that isn't x86-64 Linux: the world's
  # digests and the protocol's exact bytes, with the server that sits on both.
  # These are the crates that hold no Bevy and need nothing from the system, so
  # the whole matrix costs a fraction of what one game build does — and they
  # are, not by coincidence, where every value that must match across machines
  # is written down. Anything new that pins bytes or digests belongs here too.
  # Linux isn't in this matrix because the job above already ran these tests
  # there as part of the workspace.
  determinism:
    name: Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let both finish. Which platforms disagree is the interesting part, and
      # a cancelled sibling job doesn't say.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Same reasoning as above, and this matrix is where a red branch is most
      # likely: these are the jobs that fail when a platform stops agreeing.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Engine-free tests
        run: cargo test --locked -p world -p protocol -p server
