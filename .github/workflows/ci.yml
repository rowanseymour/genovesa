# The tests only mean something if more than one machine runs them. The map
# digest, the archipelago layout, the pinned bytes of every protocol message —
# each exists to catch a build that has quietly stopped agreeing with every
# other build about what a seed means, and a test like that run on one laptop
# is a test that has never once done its job. Here the second machine is a
# Linux runner; the first is the arm64 macOS this is developed on, which runs
# every test before a branch is ever pushed.
#
# What that costs decides the shape of this file more than taste does. A
# private repository gets 2,000 Actions minutes a month, every job bills as a
# whole minute however few seconds it took, a Windows minute counts as two and
# a macOS minute as ten. Against a hundred-odd merges a month that budget buys
# about six billed minutes a run, and the arithmetic answers three questions:
#
#   - macOS is gone, and its absence is not a gap: it is the machine the
#     comparison is made against, covered before a push. Anyone developing
#     this somewhere else should put it back.
#   - Windows is gone too, and its absence *is* a gap — it was the platform
#     nobody here can run. What it cost was the whole argument: an engine
#     built from cold on a Windows runner is most of an hour, billed double,
#     and a weekly one was a tenth of the month before a branch had spent a
#     minute. A platform disagreement is a once-a-year thing, a toolchain or
#     libm shift rather than a bad branch, and the day this has a player on
#     Windows is the day that comparison is worth its price again.
#   - Pushes to main build only when they move the dependency graph, because
#     that is now the only thing main is for: leaving a cache warm enough that
#     a branch never compiles Bevy from cold. What that gives up is catching a
#     bad interaction between two green branches at the merge itself — but the
#     next PR branches from the new main and builds it, so that arrives within
#     a PR rather than within a week.
name: CI

on:
  pull_request:
    # Documentation is generated here rather than written, and neither it nor
    # a README can fail a test. Assets are not on this list: the game's tests
    # read assets/models/boat.glb.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  # Monday morning: a rebuild of main's cache against whatever rustc stable
  # has become in the meantime, so that a toolchain bump costs one run here
  # rather than a cold build on every branch that week.
  schedule:
    - cron: '0 6 * * 1'
  # The same rebuild on demand, for when Monday is too far off.
  workflow_dispatch:

# One run per branch. A second push while the first is still compiling Bevy
# makes the first irrelevant, so don't pay for it — but let main and the weekly
# run finish, since those are what leaves the cache behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, linting and the tests in one job, which is one restore of a
  # target directory this size rather than three. Formatting goes first and
  # before the machine is prepared for anything else: it needs no system
  # libraries and no cache, so a stray blank line ends the job inside fifteen
  # seconds and bills one minute instead of six.
  #
  # Clippy and the tests do not share the work of building Bevy, only the
  # directory it lands in. Clippy is a *check* build: it stops at metadata, so
  # the dependencies come out as `.rmeta` and there is not an `.rlib` among
  # them for a test build to link against. `cargo test` therefore compiles the
  # whole of Bevy again, properly, and on a cold cache this job pays for it
  # twice — a few minutes to check and the better part of an hour to compile.
  # That is not a hang, however much it looks like one; the step is compiling
  # `bevy_ui_render` and will get there. Only a run that restores nothing pays
  # any of it, which is why the cache below is worth the care it gets.
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check

      # What Bevy 0.19 asks for on a Linux builder — alsa and udev are what its
      # -sys crates go looking for through pkg-config, and wayland matches the
      # defaults of Bevy's own CI action. No window is ever opened here; these
      # are needed to link, not to run.
      #
      # fontconfig is the one that isn't Bevy's by default: turning on
      # `system_font_discovery` so the menu's title can ask for a serif puts
      # fontique in the tree, and on Linux fontique reads the machine's font
      # database through fontconfig. Its -sys crate resolves that at *build*
      # time and panics outright when pkg-config can't find it, so a builder
      # without this compiles nothing at all — not a link error at the end, a
      # dead stop before the workspace is even checked. A feature that only
      # shows on one screen is easy to add without thinking about the builder;
      # this list is where that gets paid for.
      - name: Install Bevy's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libfontconfig1-dev

      # Only main writes a cache, and that is the whole reason main still
      # builds. Caches are scoped to the branch that saved them and a branch
      # can read only its own and the default branch's, so a pull request that
      # saved its own would be spending the repository's ten gigabytes on
      # something no other branch can ever restore — and evicting main's copy,
      # the one every branch does restore, to do it. Restoring counts as use,
      # so main's stays alive on daily reads between the rare pushes that
      # rewrite it.
      #
      # `cache-on-failure` so that a main run which builds and then fails a
      # test still leaves the engine underneath it cached; the dependencies are
      # the same either way.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--locked` because Cargo.lock is committed and a crate that resolved to
      # a different version here than on a developer's machine is exactly the
      # kind of difference the digest tests are meant to notice.
      #
      # The four #[ignore]d tests in the world crate measure rather than assert
      # — cost and shape numbers to read, not thresholds to fail on — so they
      # stay ignored. Nothing here passes `--ignored`.
      - name: Tests
        # A test that fails only on a runner has no evidence but its backtrace,
        # and a green run pays nothing for it. On the step and not the job:
        # rust-cache folds every RUST* variable it can see into its key, so a
        # job-level one would key every branch away from the cache main saved.
        env:
          RUST_BACKTRACE: 1
        run: cargo test --workspace --locked

      # A doc link is how a comment stays true about code in another module —
      # rename the target and the link breaks where a reviewer is looking. But
      # a link rustdoc cannot *resolve* is only prose in brackets: it checks
      # nothing, and two of them here had already rotted into naming things
      # that no longer existed. This is what makes the difference visible. The
      # crates are already built by the step above, so it documents them and
      # stops; `--document-private-items` because most of what one module's doc
      # names in another is private to the crate.
      - name: Doc links
        run: cargo doc --workspace --no-deps --locked --document-private-items
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
